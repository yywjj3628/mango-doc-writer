# mango-doc-writer 回归测试观察词表
# 用于扫描 final_markdown 中的无依据拔高、领导评价、文种冲突表达。
# 三类观察词互相独立，任何命中均触发告警。

# ── 1. unsupported_claims ──
# 无依据拔高表达：用户素材未提供但容易被模型自动补写的夸大描述。
unsupported_claims:
  - 取得显著成效
  - 取得重大突破
  - 实现突破性进展
  - 获得高度认可
  - 得到一致好评
  - 产生广泛影响
  - 形成示范效应
  - 行业领先
  - 社会反响热烈
  - 持续释放强劲动能

# ── 2. leadership_claims ──
# 领导评价 / 领导出席风险：用户素材未提供领导信息时容易被模型编造。
leadership_claims:
  - 领导高度肯定
  - 领导充分肯定
  - 领导充分认可
  - 与会领导高度评价
  - 得到领导肯定
  - 领导出席
  - 领导莅临
  - 领导作出重要指示
  - 领导提出明确要求

# ── 3. doc_type_conflicts ──
# 文种冲突表达：报告与请示等文种的互斥用语。
# report_forbidden: 报告中出现这些词则视为夹带请示事项
# request_forbidden: 请示中出现这些词则视为写成报告
doc_type_conflicts:
  report_forbidden:
    - 请批准
    - 请批复
    - 请予支持
    - 妥否，请批示
  request_forbidden:
    - 特此报告
