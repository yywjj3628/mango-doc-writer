  cautious:
  - term: 重大突破
    reason: 需有事实依据，不得凭空使用。用户素材或旧稿明确提及方可使用。
  - term: 历史最好
    reason: 需有数据支撑和来源确认。
  - term: 全国领先
    reason: 需有权威排名或奖项支撑。
  - term: 行业标杆
    reason: 需有具体案例和依据。
  forbidden_without_evidence:
  - term: 领导高度肯定
    reason: 除非用户素材或旧稿明确提供，否则不得新增。
  - term: 领导指出/强调
    reason: 除非用户素材或旧稿明确提供领导讲话内容，否则不得编造领导评价。
  - term: 取得突破性成效
    reason: 需有事实或数据支撑，用户素材未提供则不得使用。
  - term: 荣获XX奖
    reason: 除非用户素材或旧稿明确提及，否则不得编造获奖信息。
  - term: 参会人数超千人/万人
    reason: 除非用户提供具体数据，否则不得编造参与规模。
fixed_replacements:
- wrong: 龚政文说
  right: 龚政文指出 / 龚政文表示 / 龚政文强调
  source: mango-writer style-guide 第11章、第12章
  level: high
  context: 所有文种
  note: 口语化动词须替换为正式公文动词。
- wrong: 咱们 / 咱们公司 / 我们 / 我
  right: 湖南广电 / 集团（台） / 芒果超媒（根据具体语境选用）
  source: mango-writer style-guide 第11章、第12章
  level: high
  context: 所有文种
  note: 第一人称口语须替换为机构名称。
- wrong: 搞得不错 / 真的牛 / 超赞
  right: 取得显著成效 / 稳步推进 / 实现多点突破
  source: mango-writer style-guide 第11章
  level: high
  context: 所有文种
  note: 口语化评价须替换为正式表达。
- wrong: 涨了24%
  right: 同比增长24% / 增幅达24%
  source: mango-writer style-guide 第11章
  level: high
  context: 新闻稿 / 汇报材料
  note: 口语化增长描述须使用规范表述。
