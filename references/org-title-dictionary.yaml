disambiguation_rules:
  dianguang_siqing_company_pronoun:
    rule_name: 电广传媒司情'公司'指代规则
    rule_text: 在电广传媒司情语境中，「公司」默认指电广传媒本级。撰写子公司动态、子公司亮点工作、子公司活动稿时，不得用「公司」代指子公司，应使用具体子公司名称或明确主体称谓。若必须使用代称，应使用「该单位」「该主体」等更清晰表述，避免与电广传媒本级混淆。
    applicable_scope:
    - 新闻稿
    - 汇报材料
    - 亮点工作材料
    - 宣传推文
    - 工作总结
    applies_to:
    - 所有电广传媒旗下子公司
    examples:
    - correct: 久之润召开AI内容生产专题交流会
      incorrect: 公司召开AI内容生产专题交流会（指久之润）
    - correct: 久之润总经理顾懿出席会议
      incorrect: 公司总经理顾懿出席会议（指久之润）
    source:
    - 用户确认（2026-06-02）
    confidence: high
