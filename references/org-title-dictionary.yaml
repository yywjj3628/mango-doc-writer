metadata:
  name: 广电芒果体系称谓与口径继承库
  version: '0.1'
  purpose: 用于湖南广电 / 芒果体系内文案生成时统一机构称谓、领导职务、产品名称、战略表达和禁用称谓。
  scope: 广电系统内文案、芒果体系文案、公文、新闻稿、汇报材料、讲话稿、总结材料。
  source_policy: 优先继承现有 60 篇芒果系旧稿、老板亲自把关稿件、已有 style-guide 和 RAG 语料。
source_priority:
- level: 1
  source: 用户明确指定的当次输入
  trust: highest
  usage: 当用户明确指定称谓、领导职务、机构名称时，优先使用。
- level: 2
  source: 现有 60 篇芒果系旧稿 / 老板亲自把关稿件
  trust: high
  usage: 可继承其中稳定出现的领导职务、机构称谓、产品名称、战略表达。
- level: 3
  source: 现有 mango-writer style-guide / RAG 语料
  trust: high
  usage: 可继承体系称谓、固定表达、产品名称、常用简称。
- level: 4
  source: doc-type-rules.md
  trust: medium
  usage: 只用于文种规则，不用于补充领导职务。
- level: 5
  source: 模型自身知识
  trust: forbidden
  usage: 不得使用模型自身知识补充领导职务、机构名称、产品名称。
