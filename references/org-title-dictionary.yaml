- wrong: 说要把AI当水电煤用
  right: 推动AI基础设施化 / 将AI打造为行业水电煤
  source: mango-writer style-guide 第11章
  level: medium
  context: 新闻稿 / 汇报材料
  note: 口语化表述须转换为正式战略表达。
forbidden_names:
  organizations:
  - name: 芒果总部
    reason: 非正式称谓，旧稿和 style-guide 均明确禁止。
  - name: 湖南卫视总部
    reason: 非正式称谓，混淆机构层级。
  - name: 广电总部
    reason: 非正式称谓。
  leaders: []
  expressions:
  - expression: 咱们 / 咱们公司
    reason: 第一人称口语，所有文种禁止。
  - expression: 真的牛 / 超赞 / 绝绝子
    reason: 网络用语，所有文种禁止。
  - expression: 破防 / YYDS
    reason: 网络用语，所有文种禁止。
  - expression: 领导高度肯定（无来源时）
    reason: 编造领导评价，除非用户素材或旧稿明确提供。
  - expression: 取得突破性成效（无依据时）
    reason: 夸大成果，须有事实或数据支撑。
inheritance_policy:
  allow_inherit_from_old_drafts:
    enabled: true
    sources:
    - 60篇芒果系旧稿（/home/ywj/rag-server/docs/hunan_mango/）
    - 老板亲自把关稿件
    - 已有 mango-writer 风格手册（style-guide.md）
    - '已有 RAG 语料（collection: hunan_mango）'
  inheritable_items:
  - 机构正式名称
  - 机构规范简称
  - 领导姓名
  - 领导职务
  - 领导排序习惯
  - 产品正式名称
  - 业务板块称谓
  - 战略表达
  - 固定搭配
  - 标题风格
  - 常用结尾
  - 排比句式模板
  - 开头句式模板
  - 比喻金句
  - 高频动词（赋能、助推、深耕等）
  - 政治锚定三层结构
  not_inheritable_items_without_current_input:
  - 具体数据（如营收数字、用户数量）
  - 当次会议时间
  - 当次活动地点
  - 当次出席人员
  - 当次表态内容
  - 当次批示内容
  - 当次经营成果
  - 当次获奖信息
  - 当次合作签约细节
  - 当次调研成果
  rule:
  - 稳定称谓可以继承。旧稿中同一称谓在 3 篇以上稿件中稳定出现，视为可继承。
  - 稳定职务可以继承。旧稿中同一领导职务在多篇稿件中一致出现，视为可继承。
  - 稳定机构名称可以继承。旧稿中首次用全称、后续用简称的模式，视为可继承。
  - 具体事实不能从旧稿迁移到新稿，除非用户本次素材明确提供。
  - 旧稿中的数据（如「芒果TV会员达7560万」）不能直接迁移到新稿，除非用户本次素材确认。
  - 旧稿中的事件描述不能作为新稿的事实依据，只能借鉴表达方式。
conflict_policy:
  same_leader_multiple_titles:
    action: mark_for_manual_review
    note: 同一领导在旧稿中存在多个职务版本时，不自动选择。标记【需人工确认】并列出所有版本。
  user_input_conflicts_with_dictionary:
    action: prefer_user_input_but_warn
    note: 用户当次明确输入优先，但提示与口径库不一致。如：口径库中龚政文为「党委书记、董事长」，但用户本次要求写为其他职务，则使用用户指定职务，同时在稿件中标注提示。
  rag_conflicts_with_dictionary:
    action: prefer_dictionary
    note: RAG 仅作风格参考，口径以 org-title-dictionary.yaml 为准。RAG 中出现的领导职务/机构名称如与本库不一致，以本库为准。
  old_drafts_conflict_with_each_other:
    action: choose_high_frequency_if_stable_else_manual_review
    note: 多个旧稿出现差异时，若高频版本明显稳定（如3篇以上一致），可标记 high 并直接继承；否则标记【需人工确认】。
  style_guide_conflicts_with_old_drafts:
    action: prefer_old_drafts_for_facts_style_guide_for_patterns
    note: 事实性信息（领导职务、机构名称）以旧稿为准；表达模式（句式模板、排比结构）以 style-guide 为准。
  missing_leader_title:
    action: use_placeholder_mark_for_confirmation
    note: 旧稿中只出现领导姓名而无职务时，使用【需确认职务】占位，不使用模型自身知识补全。
review_notes:
  pre_draft_checks:
  - 检查所有领导首次提及是否带完整职务前缀。
  - 检查机构首次出现是否使用全称。
  - 检查是否存在本库 forbidden_names 中的禁用称谓。
  - 检查是否存在本库 forbidden_without_evidence 中的无依据表达。
  post_draft_checks:
  - 核对领导称谓是否与 org-title-dictionary.yaml 一致。
  - 核对机构称谓是否与 org-title-dictionary.yaml 一致。
  - 核对是否存在编造领导评价（如「领导高度肯定」无来源）。
  - 核对是否存在编造成果数据（用户素材未提供但稿件中出现）。
  - 核对是否存在从旧稿迁移的具体事实数据（未经用户确认）。
  - 核对是否存在 needs_manual_confirmation 标记的未确认内容。
  manual_confirmation_protocol:
  - 当称谓库中某领导标记 needs_manual_confirmation 时，初稿中须用【需确认职务：XXX】占位。
  - 当用户素材中领导职务与本库不一致时，使用用户指定职务，但附注说明。
  - 当出现未在本库中的领导姓名时，标记【需确认职务】，不使用模型知识补全。
